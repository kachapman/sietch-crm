# Sietch CRM — nginx site files for the production droplet (147.182.164.19)
#
# The droplet terminates TLS for two hostnames and proxies to the Docker
# containers over loopback:
#
#   crm.publicadjustermidwest.com  ->  127.0.0.1:8766  (sietch-crm)
#   docs.publicadjustermidwest.com ->  127.0.0.1:8080  (onlyoffice-docserver :80)
#
# Both containers bind 127.0.0.1 only, so nginx is the sole public entry
# point. Copy to /etc/nginx/sites-available/, symlink into sites-enabled/,
# then `nginx -t && systemctl reload nginx`.
#
# Certs: /etc/letsencrypt/live/crm.publicadjustermidwest.com/{fullchain,privkey}.pem
# Renew: certbot.timer (see deploy/provision-nginx-droplet.sh)

# ── crm.publicadjustermidwest.com ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name crm.publicadjustermidwest.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.publicadjustermidwest.com;

    ssl_certificate     /etc/letsencrypt/live/crm.publicadjustermidwest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.publicadjustermidwest.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Required for uploads to work (docs/UPDATE_AND_DEPLOY.txt).
    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;

    # Server-Sent Events (/api/events) must not be buffered or the feed stalls.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location / {
        proxy_pass http://127.0.0.1:8766;
    }
}

# ── docs.publicadjustermidwest.com ─────────────────────────────────────────
# OnlyOffice Document Server. Its internal nginx listens on :80 only (there is
# no :443 listener), so nginx proxies plain HTTP to 127.0.0.1:8080.
server {
    listen 80;
    listen [::]:80;
    server_name docs.publicadjustermidwest.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.publicadjustermidwest.com;

    ssl_certificate     /etc/letsencrypt/live/crm.publicadjustermidwest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.publicadjustermidwest.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Document uploads through the editor.
    client_max_body_size 100M;
    proxy_request_buffering off;
    # Document conversions can take a long time.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # The editor keeps a websocket open for co-editing.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $proxy_connection;
    proxy_cache_bypass $http_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
