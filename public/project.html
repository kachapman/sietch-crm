<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project — Sietch CRM</title>
  <link rel="stylesheet" href="styles.css?v=3.5.1" />
  <script>
    // Apply cached brand colors before content renders (matches index.html pattern)
    (function() {
      var root = document.documentElement;
      try {
        var cached = localStorage.getItem("sietch_branding_cache");
        if (cached) {
          var b = JSON.parse(cached);
          if (b && b.primaryColor) {
            root.style.setProperty("--accent", b.primaryColor);
            root.style.setProperty("--accent-text", "#fff");
            var rgb = b.primaryColor.replace(/^#/, "");
            var r = parseInt(rgb.substring(0, 2), 16);
            var g = parseInt(rgb.substring(2, 4), 16);
            var bl = parseInt(rgb.substring(4, 6), 16);
            root.style.setProperty("--accent-soft", "rgba(" + r + "," + g + "," + bl + ",0.15)");
            root.style.setProperty("--accent-subtle", "rgba(" + r + "," + g + "," + bl + ",0.1)");
          }
        }
      } catch(e) {}
      // Refresh branding from server
      fetch("/api/branding").then(function(r) { return r.json(); }).then(function(b) {
        if (b && b.primaryColor) {
          localStorage.setItem("sietch_branding_cache", JSON.stringify(b));
          root.style.setProperty("--accent", b.primaryColor);
          root.style.setProperty("--accent-text", "#fff");
          var rgb = b.primaryColor.replace(/^#/, "");
          var r = parseInt(rgb.substring(0, 2), 16);
          var g = parseInt(rgb.substring(2, 4), 16);
          var bl = parseInt(rgb.substring(4, 6), 16);
          root.style.setProperty("--accent-soft", "rgba(" + r + "," + g + "," + bl + ",0.15)");
          root.style.setProperty("--accent-subtle", "rgba(" + r + "," + g + "," + bl + ",0.1)");
        }
      }).catch(function() {});
    })();
  </script>
  <style>
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    .project-page { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    .back-link { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 500; margin-bottom: 1rem; }
    .back-link:hover { text-decoration: underline; }
    .project-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .project-header h1 { margin: 0; font-size: 1.5rem; flex: 1; color: var(--text); }
    .project-meta { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.5rem; font-size: 0.85rem; }
    .project-meta-item { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.7rem; color: var(--text); }
    .project-desc { margin-bottom: 1.5rem; font-size: 0.9rem; line-height: 1.6; color: var(--text); }
    .project-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
    .project-tag { background: var(--accent-soft); color: var(--accent); padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; font-weight: 500; }
    .project-tag--hp { background: rgba(255, 183, 77, 0.2); color: #ffb74d; }
    .project-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; }
    .project-field { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.75rem; }
    .project-field dt { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.2rem; }
    .project-field dd { font-size: 0.9rem; color: var(--text); margin: 0; word-break: break-word; }
    .project-section { margin-bottom: 1.5rem; }
    .project-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
    .project-section-head h2 { margin: 0; font-size: 1rem; font-weight: 600; }
    .add-note-btn { display: inline-flex; align-items: center; gap: 0.3rem; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.6rem; color: var(--muted); font-size: 0.8rem; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .add-note-btn:hover { background: var(--surface); color: var(--text); }
    .event-list { list-style: none; padding: 0; margin: 0; }
    .event-item { border-left: 3px solid var(--border); padding: 0.5rem 0.7rem; margin-bottom: 0.4rem; background: var(--surface); border-radius: 0 6px 6px 0; overflow: hidden; position: relative; }
    .event-item.event-highlighted { border-left-color: #6366f1; background: rgba(99, 102, 241, 0.1); }
    .event-date { font-size: 0.75rem; color: var(--muted); }
    .event-cat { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
    .event-author { font-size: 0.75rem; color: var(--muted); }
    .event-body { font-size: 0.88rem; margin-top: 0.2rem; color: var(--text); max-height: 280px; overflow: auto; position: relative; word-break: break-word; white-space: normal; }
    .event-body img { max-width: 100%; height: auto; }
    .event-body table { max-width: 100%; }
    .opp-preview-audio-player {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.2rem;
      margin: 0.2rem 0;
      max-width: 100%;
    }
    .opp-preview-audio-player--stacked {
      align-items: flex-end;
      width: 100%;
    }
    .opp-preview-audio-player .opp-preview-attachment-link {
      max-width: none;
      font-size: 0.78rem;
    }
    .opp-preview-audio-player-el {
      width: 100%;
      max-width: 18rem;
      height: 32px;
      display: block;
    }
    @media (max-width: 480px) {
      .opp-preview-audio-player-el { max-width: 100%; }
    }
    .event-email-summary { display: flex; flex-direction: column; gap: 0.15rem; }
    .event-email-from, .event-email-date { font-size: 0.78rem; color: var(--muted); }
    .event-email-snippet { font-size: 0.82rem; color: var(--text); opacity: 0.8; }
    .event-email-expand { margin-top: 0.3rem; }
    .event-email-expand-btn {
      font: inherit; font-size: 0.75rem; padding: 0.2rem 0.5rem;
      border: 1px solid var(--border); border-radius: 4px; background: transparent;
      color: var(--accent); cursor: pointer;
    }
    .event-email-expand-btn:hover { background: var(--surface); }
    .event-email-full {
      margin-top: 0.3rem; padding: 0.4rem; font-size: 0.8rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
      white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow-y: auto;
    }
    .event-replies { margin-top: 0.3rem; display: flex; flex-direction: column; }
    .event-reply-btn {
      font: inherit; font-size: 0.7rem; padding: 0.15rem 0.4rem;
      border: 1px solid var(--border); border-radius: 4px; background: transparent;
      color: var(--muted); cursor: pointer; align-self: flex-end;
    }
    .event-reply-btn:hover { border-color: var(--accent); color: var(--accent); }
    .event-thread {
      width: 100%; margin-top: 0.3rem; padding-left: 0.75rem;
      border-left: 2px solid var(--accent);
    }
    .event-reply-item { padding: 0.3rem 0; font-size: 0.78rem; }
    .event-reply-item + .event-reply-item { border-top: 1px solid var(--border); }
    .event-reply-meta { font-size: 0.68rem; color: var(--muted); margin-bottom: 0.15rem; }
    .event-reply-body { color: var(--text); line-height: 1.4; }
    .event-reply-body.deleted { font-style: italic; color: var(--muted); }
    .event-reply-editor { margin-top: 0.3rem; }
    .event-reply-input {
      width: 100%; padding: 0.3rem 0.5rem; border: 1px solid var(--border);
      border-radius: var(--radius, 6px); background: var(--surface-2); color: var(--text);
      font: inherit; font-size: 0.82rem; resize: vertical; min-height: 2.5rem;
    }
    .event-reply-input:focus { outline: none; border-color: var(--accent); }
    .event-reply-actions { display: flex; justify-content: flex-end; gap: 0.4rem; margin-top: 0.25rem; }
    .event-reply-cancel {
      font: inherit; font-size: 0.75rem; padding: 0.2rem 0.5rem;
      border: 1px solid var(--border); border-radius: 4px; background: transparent;
      color: var(--muted); cursor: pointer;
    }
    .event-reply-post {
      font: inherit; font-size: 0.75rem; padding: 0.2rem 0.5rem;
      border: none; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer;
    }
    .project-empty { color: var(--muted); font-style: italic; padding: 1rem 0; }
    .auth-error { max-width: 400px; margin: 4rem auto; text-align: center; color: var(--muted); }
    .auth-error a { color: var(--accent); }
    .project-loading { text-align: center; padding: 3rem; color: var(--muted); }
    .phtml-note-editor-wrap { display: none; margin-bottom: 1rem; }
    .phtml-note-editor-wrap.active { display: block; }
    .phtml-note-format-toolbar { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 0; border: 1px solid var(--border); border-bottom: none; border-radius: 6px 6px 0 0; background: var(--surface); padding: 0.25rem 0.3rem; }
    .phtml-note-format-btn { background: none; border: none; color: var(--muted); font-size: 0.85rem; padding: 0.25rem 0.4rem; cursor: pointer; border-radius: 3px; min-width: 1.5rem; text-align: center; display: inline-flex; align-items: center; justify-content: center; }
    .phtml-note-format-btn:hover { background: var(--surface-2); color: var(--text); }
    .phtml-note-sep { width: 1px; height: 18px; background: var(--border); margin: 0 0.2rem; align-self: center; }
    .phtml-note-editor { min-height: 80px; max-height: 300px; overflow-y: auto; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; background: var(--surface-2, #1f2430); color: var(--text); font-family: var(--font); font-size: 0.9rem; outline: none; line-height: 1.5; }
    .phtml-note-editor:focus { border-color: var(--accent); }
    .phtml-note-editor:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
    .phtml-note-actions { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
    .phtml-note-cancel { margin-left: auto; }
    .phtml-note-submit { background: var(--accent); color: var(--accent-text, #fff); border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.85rem; }
    .phtml-note-submit:hover { opacity: 0.9; }
    .phtml-note-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .phtml-note-cancel { background: none; color: var(--muted); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .phtml-note-cancel:hover { color: var(--text); border-color: var(--muted); }
    .toast-phtml { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.85rem; z-index: 9999; box-shadow: var(--shadow); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast-phtml.visible { opacity: 1; }
    .toast-phtml.error { border-color: var(--danger); }
    .phtml-mention-wrap { position: relative; }
    .phtml-mention-dropdown { position: absolute; z-index: 100; background: var(--surface, #181b24); border: 1px solid var(--border, #2a2e3a); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.35); max-height: 180px; overflow-y: auto; min-width: 160px; display: none; }
    .phtml-mention-dropdown.open { display: block; }
    .phtml-mention-item { padding: 0.35rem 0.6rem; cursor: pointer; font-size: 0.85rem; color: var(--text, #e0e0e0); }
    .phtml-mention-item:hover, .phtml-mention-item.selected { background: var(--surface-2, #1f2430); }
    .phtml-mention-chip { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 10px; font-size: 0.82rem; font-weight: 500; color: #fff; background: var(--mention-color, hsl(200, 55%, 42%)); }
    .phtml-mention-inline { color: var(--mention-color, var(--accent, #4f8cff)); font-weight: 500; cursor: default; }
    @media (max-width: 600px) {
      .project-page { padding: 0 0.5rem; margin: 1rem auto; }
      .project-fields { grid-template-columns: 1fr; }
      .project-header h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div id="auth-screen" class="auth-error">
    <h2>Sign in required</h2>
    <p>You must be signed in to view project details.</p>
    <a href="/">Back to dashboard</a>
  </div>

  <div id="project-page" class="project-page hidden">
    <a href="/" class="back-link">&larr; Back to dashboard</a>
    <div class="project-header">
      <h1 id="project-title">Loading...</h1>
    </div>
    <div id="project-meta" class="project-meta"></div>
    <div id="project-desc" class="project-desc hidden"></div>
    <div id="project-tags" class="project-tags"></div>
    <div id="project-fields" class="project-fields"></div>

    <div class="project-section">
      <div class="project-section-head">
        <h2>History &amp; notes</h2>
        <button type="button" id="phtml-add-note-btn" class="add-note-btn" title="Add note">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/></svg>
          <span>add note</span>
        </button>
      </div>

      <div id="phtml-note-editor-wrap" class="phtml-note-editor-wrap">
        <div class="phtml-note-format-toolbar note-format-toolbar" aria-label="Formatting">
          <button type="button" class="phtml-note-format-btn note-format-btn" data-cmd="bold" title="Bold"><b>B</b></button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-cmd="italic" title="Italic"><i>I</i></button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-cmd="underline" title="Underline"><u>U</u></button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
          <span class="phtml-note-sep note-format-sep"></span>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-cmd="insertUnorderedList" title="Bullet list">&bull;</button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-cmd="insertOrderedList" title="Numbered list">1.</button>
          <span class="phtml-note-sep note-format-sep"></span>
          <button type="button" class="phtml-note-format-btn note-format-btn note-format-hilite-btn" title="Highlight color">&#x1F58D;</button>
          <button type="button" class="phtml-note-format-btn note-format-btn note-format-emoji-btn" title="Emoji">&#x1F600;</button>
          <button type="button" class="phtml-note-format-btn note-format-btn note-format-link-btn" title="Insert link">&#x1F517;</button>
          <button type="button" class="phtml-note-format-btn note-format-btn note-format-color-btn" title="Text color">A<span class="note-format-color-bar"></span></button>
          <button type="button" class="phtml-note-format-btn note-format-btn note-format-overflow-btn" title="More formatting">&middot;&middot;&middot;</button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-overflow="1" data-cmd="formatBlock" data-val="H2" title="Heading 2"><b>H2</b></button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-overflow="1" data-cmd="formatBlock" data-val="H3" title="Heading 3"><b>H3</b></button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-overflow="1" data-cmd="formatBlock" data-val="BLOCKQUOTE" title="Quote">&#10077;</button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-overflow="1" data-cmd="formatBlock" data-val="PRE" title="Code block">&lt;/&gt;</button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-overflow="1" data-cmd="insertHorizontalRule" title="Horizontal rule">&#8213;</button>
          <span class="phtml-note-sep note-format-sep" data-overflow="1"></span>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-overflow="1" data-cmd="indent" title="Indent">&rarr;</button>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-overflow="1" data-cmd="outdent" title="Outdent">&larr;</button>
          <span class="phtml-note-sep note-format-sep" data-overflow="1"></span>
          <button type="button" class="phtml-note-format-btn note-format-btn" data-overflow="1" data-cmd="removeFormat" title="Clear formatting">&#x232B;</button>
          <button type="button" class="phtml-note-format-btn note-format-btn note-format-img-upload-btn" data-overflow="1" title="Upload image">&#x1F4F7;</button>
        </div>
        <div class="phtml-mention-wrap">
          <div class="phtml-note-editor" contenteditable="true" data-placeholder="Write a note... Type @ to mention someone." id="phtml-note-editor"></div>
          <div class="phtml-mention-dropdown" id="phtml-mention-dropdown"></div>
        </div>
        <div class="phtml-note-actions">
          <button type="button" class="btn btn-ghost btn-sm note-backdate-btn" title="Set event date"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/><path d="M7 14h.013"/><path d="M10.01 14h.005"/><path d="M13.01 14h.005"/><path d="M16.015 14h.005"/><path d="M13.015 17h.005"/><path d="M7.01 17h.005"/><path d="M10.01 17h.005"/></svg></button>
          <span class="backdate-display hidden"></span>
          <button type="button" id="phtml-note-cancel" class="phtml-note-cancel">Cancel</button>
          <button type="button" id="phtml-note-submit" class="phtml-note-submit">Add note</button>
        </div>
      </div>

      <ul id="project-events" class="event-list">
        <li class="project-loading">Loading events...</li>
      </ul>
    </div>
  </div>

  <div id="phtml-toast" class="toast-phtml"></div>

  <script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var projectId = params.get("project_number") || params.get("id");
    var highlightEventId = params.get("event");
    var opp = null;
    var portalUsers = [];

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    // Audio extension matcher + player injector for the standalone project
    // page (mirrors the same logic in public/app.js sanitizeHistoryHtml /
    // renderHistoryAttachmentsAside). Replaces any <a href="...mp3|.m4a|.wav|...">
    // inside an event body with a wrapper containing the original link + a
    // native <audio controls preload="none"> element below it.
    var PHTML_AUDIO_EXTS = [".mp3",".m4a",".wav",".ogg",".oga",".opus",".flac",".aac",".webm"];
    function isAudioUrlPhtml(url) {
      var u = String(url || "").trim();
      if (!u) return false;
      var noQuery = u.split("#")[0].split("?")[0].toLowerCase();
      for (var i = 0; i < PHTML_AUDIO_EXTS.length; i++) {
        if (noQuery.endsWith(PHTML_AUDIO_EXTS[i])) return true;
      }
      return false;
    }
    function isAudioUrlOrTextPhtml(href, text) {
      var h = String(href || "").trim();
      var noQuery = h.split("#")[0].split("?")[0].toLowerCase();
      var t = String(text || "").toLowerCase().trim();
      for (var i = 0; i < PHTML_AUDIO_EXTS.length; i++) {
        if (noQuery.endsWith(PHTML_AUDIO_EXTS[i])) return true;
        if (t.endsWith(PHTML_AUDIO_EXTS[i])) return true;
      }
      return false;
    }
    function injectAudioPlayers(rootEl) {
      if (!rootEl) return;
      var links = Array.prototype.slice.call(rootEl.querySelectorAll("a[href]"));
      for (var i = 0; i < links.length; i++) {
        var a = links[i];
        var href = a.getAttribute("href") || "";
        if (!isAudioUrlOrTextPhtml(href, (a.textContent || "").trim())) continue;
        var filename = (a.textContent || "").trim() || href.split("/").pop() || "Audio";
        var parent = a.parentNode;
        if (!parent) continue;
        var next = a.nextSibling;
        var wrap = document.createElement("div");
        wrap.className = "opp-preview-audio-player opp-preview-audio-player--stacked";
        a.className = "opp-preview-attachment-link";
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
        wrap.appendChild(a);
        var audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "none";
        audio.src = href;
        audio.className = "opp-preview-audio-player-el";
        audio.setAttribute("aria-label", "Play " + filename);
        wrap.appendChild(audio);
        if (next) parent.insertBefore(wrap, next);
        else parent.appendChild(wrap);
      }
    }

    function showToast(msg, isError) {
      var el = document.getElementById("phtml-toast");
      if (!el) return;
      el.textContent = msg;
      el.className = "toast-phtml visible" + (isError ? " error" : "");
      clearTimeout(el._timer);
      el._timer = setTimeout(function() { el.className = "toast-phtml"; }, 3000);
    }

    function showPage() {
      document.getElementById("auth-screen").classList.add("hidden");
      document.getElementById("project-page").classList.remove("hidden");
    }

    function showAuth() {
      document.getElementById("project-page").classList.add("hidden");
      document.getElementById("auth-screen").classList.remove("hidden");
    }

    function showError(msg) {
      document.getElementById("project-title").textContent = "Error loading project";
      var meta = document.getElementById("project-meta");
      meta.innerHTML = '<span class="project-meta-item" style="color:var(--danger);">' + esc(msg) + '</span>';
    }

    function formatDate(s) {
      if (!s) return "";
      try {
        var d = new Date(s);
        if (isNaN(d.getTime())) return String(s);
        var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
      } catch(e) { return String(s); }
    }

    function renderFields(data) {
      var meta = document.getElementById("project-meta");
      var items = [];
      var stageObj = data.stage || data.Stage || null;
      var stageTitle = stageObj ? (stageObj.title || stageObj.Title || "") : (typeof stageObj === "string" ? stageObj : "");
      var value = data.value || data.Value || data.bidValue || data.BidValue || "";
      var contact = data.contact || data.Contact || "";
      var dueDate = data.dueDate || data.DueDate || data.expectedCloseDate || data.ExpectedCloseDate || "";
      var responsible = data.responsibleUser || data.ResponsibleUser || data.responsible || "";
      var created = data.created || data.Created || data.createdAt || data.CreatedAt || "";
      var isPrivate = data.isPrivate || data.IsPrivate || false;

      if (stageTitle) items.push("Stage: " + stageTitle);
      if (value) items.push("Value: " + String(value));
      if (contact) {
        var cName = typeof contact === "object" ? (contact.displayName || contact.DisplayName || contact.name || contact.Name || "") : String(contact);
        if (cName) items.push("Contact: " + cName);
      }
      if (dueDate) items.push("Due: " + formatDate(dueDate));
      if (responsible) {
        var rName = typeof responsible === "object" ? (responsible.displayName || responsible.DisplayName || responsible.id || responsible.Id) : String(responsible);
        items.push("Responsible: " + rName);
      }
      if (created) items.push("Created: " + formatDate(created));
      if (isPrivate) items.push("Private");

      meta.innerHTML = items.map(function(s) { return '<span class="project-meta-item">' + esc(s) + '</span>'; }).join("");

      var desc = document.getElementById("project-desc");
      var descText = data.description || data.Description || "";
      if (descText) {
        desc.innerHTML = descText;
        desc.classList.remove("hidden");
      } else {
        desc.classList.add("hidden");
      }

      var tagsEl = document.getElementById("project-tags");
      var tags = data.tags || data.Tags || [];
      if (tags.length) {
        tagsEl.innerHTML = tags.map(function(t) {
          var title = typeof t === "string" ? t : (t.title || t.Title || "");
          var color = (typeof t === "object" && (t.color || t.Color)) || "";
          var isHP = title.toLowerCase().indexOf("high priority") !== -1;
          var cls = isHP ? "project-tag project-tag--hp" : "project-tag";
          var style = color ? 'background:' + esc(color) + ';color:#fff;' : "";
          return '<span class="' + cls + '" style="' + style + '">' + esc(title) + '</span>';
        }).join("");
      }

    }

    function renderUserFields(userFieldRows) {
      var fieldsEl = document.getElementById("project-fields");
      if (!userFieldRows || !userFieldRows.length) {
        fieldsEl.style.display = "none";
        return;
      }
      var html = "";
      for (var i = 0; i < userFieldRows.length; i++) {
        var row = userFieldRows[i];
        html += '<div class="project-field"><dt>' + esc(row.label) + '</dt><dd>' + esc(row.value) + '</dd></div>';
      }
      fieldsEl.innerHTML = html;
      // Linkify URLs in field values
      fieldsEl.querySelectorAll("dd").forEach(function(dd) {
        var txt = dd.textContent || "";
        if (!txt || !/https?:\/\//i.test(txt)) return;
        dd.innerHTML = txt.replace(/(https?:\/\/[^\s<]+[^\s<,.!?:;)\]}>])/gi, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
      });
    }

    function renderEvents(events) {
      var list = document.getElementById("project-events");
      if (!events || !events.length) {
        list.innerHTML = '<li class="project-empty">No history events</li>';
        return;
      }
      list.innerHTML = "";
      for (var i = 0; i < events.length; i++) {
        var ev = events[i];
        var li = document.createElement("li");
        var isHighlighted = highlightEventId && String(ev.id) === String(highlightEventId);
        li.className = "event-item" + (isHighlighted ? " event-highlighted" : "");

        var date = ev.createdOn || ev.created || ev.date || ev.CreatedOn || ev.Created || "";
        var title = ev.title || ev.Title || "";
        var category = ev.category || ev.Category || "";
        var categoryLabel = "";
        if (typeof category === "object" && category) {
          categoryLabel = category.title || category.Title || "";
        } else if (category) {
          categoryLabel = String(category);
        }
        var body = ev.body || ev.Body || ev.content || ev.Content || "";
        var mailPayload = null;
        try {
          var parsed = typeof body === "string" && body.trim().charAt(0) === '{' ? JSON.parse(body) : null;
          if (parsed && (
            parsed.source === "onlyoffice_import" ||
            parsed.type === "email_snapshot" ||
            (parsed.from && parsed.subject && (parsed.message_id || parsed.messageId))
          )) {
            mailPayload = parsed;
          }
        } catch(e) {}
        function sanitizeHtml(html) {
          if (!html) return "";
          var tmp = document.createElement("div");
          tmp.innerHTML = html;
          tmp.querySelectorAll("script,style,iframe,object,embed,form,input,textarea,select,button").forEach(function(el) { el.remove(); });
          tmp.querySelectorAll("[onclick],[onload],[onerror],[onmouseover]").forEach(function(el) {
            el.removeAttribute("onclick");
            el.removeAttribute("onload");
            el.removeAttribute("onerror");
            el.removeAttribute("onmouseover");
          });
          tmp.querySelectorAll("[style]").forEach(function(el) {
            var s = el.getAttribute("style") || "";
            el.setAttribute("style", s.replace(/position\s*:\s*(absolute|fixed|sticky)/gi, "position:static"));
          });
          return tmp.innerHTML;
        }
        var authorName = ev.author || ev.Author || "";
        if (!authorName) {
          var author = ev.createdBy || ev.created_by || "";
          if (typeof author === "object" && author) {
            authorName = author.displayName || author.DisplayName || author.userName || author.UserName || "";
          } else if (author) {
            authorName = String(author);
          }
        }

        var html = '<div class="event-date">' + esc(date ? formatDate(date) : "");
        if (categoryLabel) html += ' &middot; <span class="event-cat">' + esc(categoryLabel) + '</span>';
        if (authorName) html += ' &middot; <span class="event-author">' + esc(authorName) + '</span>';
        html += '</div>';
        if (title) html += '<div class="event-body"><strong>' + esc(title) + '</strong></div>';
        if (mailPayload) {
          var mSubject = mailPayload.subject || mailPayload.Subject || "";
          var mFrom = mailPayload.from || mailPayload.From || "";
          var mDate = mailPayload.date_sent || mailPayload.dateSent || "";
          var mFullText = (mailPayload.body_text || mailPayload.introduction || "").replace(/<[^>]+>/g, "").replace(/\t/g, " ").trim();
          var mSnippet = mFullText.slice(0, 150);
          html += '<div class="event-body event-email-summary">';
          if (mSubject) html += '<div class="event-email-subject"><strong>' + esc(mSubject) + '</strong></div>';
          if (mFrom) html += '<div class="event-email-from">From: ' + esc(mFrom) + '</div>';
          if (mDate) html += '<div class="event-email-date">Sent: ' + esc(mDate) + '</div>';
          if (mSnippet) html += '<div class="event-email-snippet">' + esc(mSnippet) + '…</div>';
          if (mFullText.length > 150) {
            var uid = 'eml-' + Math.random().toString(36).slice(2,8);
            html += '<div class="event-email-expand"><button type="button" class="event-email-expand-btn" data-target="' + uid + '">Show full email</button></div>';
            html += '<div class="event-email-full" id="' + uid + '" style="display:none;">' + esc(mFullText) + '</div>';
          }
          html += '</div>';
        } else if (body) {
          html += '<div class="event-body">' + sanitizeHtml(body) + '</div>';
        }

        li.innerHTML = html;
        // Audio-link post-pass: any <a> in the rendered event body whose href
        // looks like an audio file gets replaced with an embedded
        // <audio controls> player (filename link + native control bar). This
        // mirrors the equivalent helper in public/app.js sanitizeHistoryHtml
        // so the same audio-file links work in every project modal.
        injectAudioPlayers(li);
        list.appendChild(li);

        // Auto-load and render replies for this event
        if (ev.id && !mailPayload) {
          let replyWrap = document.createElement("div");
          replyWrap.className = "event-replies";
          li.appendChild(replyWrap);

          // Reply button
          let replyBtn = document.createElement("button");
          replyBtn.type = "button";
          replyBtn.className = "event-reply-btn";
          replyBtn.textContent = "Reply";
          replyWrap.appendChild(replyBtn);

          // Auto-load replies
          fetch("/api/v2/projects/" + projectId + "/history/" + ev.id + "/replies", { credentials: "same-origin" })
            .then(function(r) { return r.ok ? r.json() : []; })
            .then(function(replies) {
              let list = Array.isArray(replies) ? replies : [];
              if (!list.length) return;
              let threadEl = document.createElement("div");
              threadEl.className = "event-thread";
              for (let j = 0; j < list.length; j++) {
                let r = list[j];
                let rDiv = document.createElement("div");
                rDiv.className = "event-reply-item";
                if (r.isDeleted) rDiv.classList.add("deleted");
                let rMeta = document.createElement("div");
                rMeta.className = "event-reply-meta";
                rMeta.textContent = [r.author || "", r.created ? formatDate(r.created) : ""].filter(Boolean).join(" \u00b7 ");
                rDiv.appendChild(rMeta);
                let rBody = document.createElement("div");
                rBody.className = "event-reply-body";
                rBody.innerHTML = r.isDeleted ? "This reply was deleted." : (r.content || "");
                rDiv.appendChild(rBody);
                threadEl.appendChild(rDiv);
              }
              replyWrap.insertBefore(threadEl, replyBtn);
              replyWrap.dataset.loaded = "1";
            }).catch(function() {});

          // Reply button click handler
          replyBtn.addEventListener("click", function() {
            let existing = replyWrap.querySelector(".event-reply-editor");
            if (existing) { existing.remove(); replyBtn.style.display = ""; return; }
            replyBtn.style.display = "none";
            let editor = document.createElement("div");
            editor.className = "event-reply-editor";
            let textarea = document.createElement("textarea");
            textarea.className = "event-reply-input";
            textarea.placeholder = "Write a reply\u2026";
            textarea.rows = 2;
            let actions = document.createElement("div");
            actions.className = "event-reply-actions";
            let cancelBtn = document.createElement("button");
            cancelBtn.type = "button";
            cancelBtn.className = "event-reply-cancel";
            cancelBtn.textContent = "Cancel";
            let postBtn = document.createElement("button");
            postBtn.type = "button";
            postBtn.className = "event-reply-post";
            postBtn.textContent = "Post";
            actions.appendChild(cancelBtn);
            actions.appendChild(postBtn);
            editor.appendChild(textarea);
            editor.appendChild(actions);
            replyWrap.appendChild(editor);
            textarea.focus();

            cancelBtn.addEventListener("click", function() { editor.remove(); replyBtn.style.display = ""; });
            postBtn.addEventListener("click", function() {
              var content = textarea.value.trim();
              if (!content) return;
              postBtn.disabled = true;
              fetch("/api/v2/projects/" + projectId + "/history/" + ev.id + "/replies", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({ content: content })
              }).then(function(r) {
                if (!r.ok) throw new Error("Failed");
                editor.remove();
                replyBtn.style.display = "";
                replyWrap.dataset.loaded = "";
                var oldThread = replyWrap.querySelector(".event-thread");
                if (oldThread) oldThread.remove();
                replyBtn.click(); // Reload replies
              }).catch(function() {
                postBtn.disabled = false;
              });
            });
          });
        }

        if (isHighlighted) {
          (function(el) {
            setTimeout(function() { el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 100);
          })(li);
        }
      }
    }

    // --- @-mention autocomplete ---
    async function fetchUsers() {
      if (portalUsers.length) return;
      try {
        var resp = await fetch("/api/v2/users?startIndex=0&count=300", { credentials: "same-origin" });
        if (!resp.ok) return;
        var raw = await resp.json();
        var list = (raw.data || raw.rows || raw || []);
        portalUsers = list.map(function(u) {
          return { id: u.id ?? u.ID, name: u.displayName || u.DisplayName || u.userName || u.UserName || String(u.id ?? u.ID) };
        }).filter(function(u) { return u.id != null; });
        portalUsers.sort(function(a, b) { return String(a.name).localeCompare(String(b.name)); });
      } catch(e) { portalUsers = []; }
    }

    function mentionColor(name) {
      var h = 0;
      for (var i = 0; i < (name || "").length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
      return "hsl(" + (Math.abs(h) % 360) + ", 55%, 42%)";
    }

    function mentionInsertChip(dropdownEl, name, userId) {
      var editorEl = dropdownEl.parentElement.querySelector(".phtml-note-editor");
      if (!editorEl) return;
      editorEl.focus();
      var sel = window.getSelection();
      if (!sel.rangeCount) return;

      var span = document.createElement("span");
      span.className = "phtml-mention-inline";
      span.dataset.userId = userId;
      span.setAttribute("contenteditable", "false");
      span.style.setProperty("--mention-color", mentionColor(name));
      span.textContent = "@" + name;

      var range = sel.getRangeAt(0);
      range.collapse(false);
      range.insertNode(span);

      range.setStartAfter(span);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);

      var space = document.createTextNode("\u00A0");
      range.insertNode(space);
      range.setStartAfter(space);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function mentionRenderDropdown(dropdownEl, query) {
      var q = (query || "").toLowerCase();
      var matches = portalUsers
        .filter(function(u) { return String(u.name).toLowerCase().indexOf(q) !== -1 || String(u.id) === q; })
        .slice(0, 10);
      dropdownEl.innerHTML = "";
      if (!matches.length) {
        dropdownEl.classList.remove("open");
        return;
      }
      matches.forEach(function(u) {
        var item = document.createElement("div");
        item.className = "phtml-mention-item";
        item.dataset.userId = u.id;
        item.dataset.userName = u.name;
        item.innerHTML = '<span class="phtml-mention-chip" style="--mention-color:' + mentionColor(u.name) + '">@' + esc(u.name) + '</span>';
        item.addEventListener("mousedown", function(e) {
          e.preventDefault();
          var startNode = dropdownEl._mentionStartNode;
          var startOffset = dropdownEl._mentionStartOffset;
          if (startNode && startNode.nodeType === Node.TEXT_NODE) {
            var text = startNode.textContent || "";
            var curSel = window.getSelection();
            var cursorOffset = curSel.rangeCount ? curSel.getRangeAt(0).startOffset : text.length;
            var before = text.slice(0, startOffset);
            var after = text.slice(cursorOffset);
            startNode.textContent = before + after;
            var r = document.createRange();
            r.setStart(startNode, before.length);
            r.collapse(true);
            curSel.removeAllRanges();
            curSel.addRange(r);
          }
          mentionInsertChip(dropdownEl, u.name, u.id);
          dropdownEl.classList.remove("open");
          dropdownEl._mentionQuery = null;
        });
        dropdownEl.appendChild(item);
      });
      dropdownEl.classList.add("open");
    }

    function setupMentionAutocomplete(editorEl, dropdownEl) {
      if (!editorEl || !dropdownEl) return;

      editorEl.addEventListener("input", function() {
        var sel = window.getSelection();
        if (!sel.rangeCount) return;
        var range = sel.getRangeAt(0);
        var node = range.startContainer;
        if (node.nodeType !== Node.TEXT_NODE) { dropdownEl._mentionQuery = null; dropdownEl.classList.remove("open"); return; }
        var text = node.textContent || "";
        var cursor = range.startOffset;
        var atPos = -1;
        for (var i = cursor - 1; i >= 0; i--) {
          if (text[i] === "@") { atPos = i; break; }
          if (text[i] === " " || text[i] === "\n" || text[i] === "\t") break;
        }
        if (atPos < 0) { dropdownEl._mentionQuery = null; dropdownEl.classList.remove("open"); return; }
        var query = text.slice(atPos + 1, cursor);
        dropdownEl._mentionQuery = query;
        dropdownEl._mentionStartNode = node;
        dropdownEl._mentionStartOffset = atPos;
        mentionRenderDropdown(dropdownEl, query);
        var rect = range.getBoundingClientRect();
        var editorRect = editorEl.getBoundingClientRect();
        dropdownEl.style.top = (rect.bottom - editorRect.top + 4) + "px";
        dropdownEl.style.left = (rect.left - editorRect.left) + "px";
      });

      editorEl.addEventListener("keydown", function(e) {
        if (!dropdownEl.classList.contains("open")) return;
        if (e.key === "Escape") { dropdownEl.classList.remove("open"); return; }
        if (e.key === "Enter" || e.key === "Tab") {
          var first = dropdownEl.querySelector(".phtml-mention-item");
          if (first) {
            e.preventDefault();
            first.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
          }
        }
      });

      editorEl.addEventListener("blur", function() {
        setTimeout(function() { dropdownEl.classList.remove("open"); }, 150);
      });
    }

    function extractMentions(editorEl) {
      if (!editorEl) return [];
      var spans = editorEl.querySelectorAll(".phtml-mention-inline[data-user-id]");
      if (!spans || !spans.length) return [];
      var ids = [];
      spans.forEach(function(s) { var n = parseInt(s.dataset.userId, 10); if (n) ids.push(n); });
      return [...new Set(ids)];
    }

    // --- Auth + Load ---
    (async function() {
      if (!projectId) {
        document.getElementById("project-page").innerHTML = '<div class="auth-error"><h2>Missing project ID</h2><p>No project ID in URL.</p><a href="/">Back to dashboard</a></div>';
        showPage();
        return;
      }

      var me;
      try {
        var authResp = await fetch("/api/v2/me", { credentials: "same-origin" });
        if (!authResp.ok) throw new Error("not authed");
        me = await authResp.json();
      } catch(e) {
        showAuth();
        return;
      }

      showPage();

      // Pre-fetch portal users for @mentions
      fetchUsers();

      // Load custom field definitions for user fields
      var cfDefs = [];
      var cfDefsById = {};
      try {
        var cfDefsResp = await fetch("/api/v2/custom-fields", { credentials: "same-origin" });
        if (cfDefsResp.ok) {
          var cfDefsRaw = await cfDefsResp.json();
          cfDefs = (cfDefsRaw.data || cfDefsRaw.rows || cfDefsRaw || []);
          for (var ci = 0; ci < cfDefs.length; ci++) {
            var d = cfDefs[ci];
            var did = d.id ?? d.ID ?? d.fieldId ?? d.FieldId;
            if (did != null) cfDefsById[String(did)] = d;
          }
        }
      } catch(e) { /* ignore */ }

      try {
        var projResp = await fetch("/api/v2/projects/" + projectId, { credentials: "same-origin" });
        if (!projResp.ok) throw new Error("HTTP " + projResp.status);
        var raw = await projResp.json();
        opp = raw.data || raw;
        document.getElementById("project-title").textContent = opp.title || opp.Title || "Project #" + projectId;
        document.title = (opp.title || opp.Title || "Project") + " — Sietch CRM";
        renderFields(opp);

        // Fetch user field values and cross-reference with definitions
        try {
          var cfValsResp = await fetch("/api/v2/projects/" + projectId + "/custom-fields", { credentials: "same-origin" });
          if (cfValsResp.ok) {
            var cfValsRaw = await cfValsResp.json();
            var cfValues = (cfValsRaw.data || cfValsRaw.rows || cfValsRaw || []);
            var userFieldRows = [];
            var seen = {};
            // First: render fields that have definitions (gets proper labels)
            for (var di = 0; di < cfDefs.length; di++) {
              var def = cfDefs[di];
              var defId = def.id ?? def.ID ?? def.fieldId ?? def.FieldId;
              if (defId == null) continue;
              var typeCode = (function(ft) {
                if (typeof ft === "number") return ft;
                if (typeof ft === "string") {
                  var s = ft.toLowerCase().replace(/\s+/g, "");
                  if (s.includes("textarea")) return 1;
                  if (s.includes("selectbox") || s === "select") return 2;
                  if (s.includes("checkbox") || s === "check") return 3;
                  if (s.includes("heading") || s === "head") return 4;
                  if (s.includes("date")) return 5;
                }
                return 0;
              })(def.fieldType ?? def.FieldType ?? def.fieldTypeTitle ?? def.FieldTypeTitle);
              if (typeCode === 4) continue; // skip headings
              var key = String(defId);
              seen[key] = true;
              var defLabel = def.label ?? def.Label ?? def.title ?? def.Title ?? def.name ?? ("Field " + defId);
              // Find matching value
              var rawVal = "";
              for (var vi = 0; vi < cfValues.length; vi++) {
                var vId = cfValues[vi].id ?? cfValues[vi].ID ?? cfValues[vi].fieldId ?? cfValues[vi].FieldId;
                if (String(vId) === key) {
                  rawVal = cfValues[vi].fieldValue ?? cfValues[vi].FieldValue ?? cfValues[vi].value ?? cfValues[vi].Value ?? "";
                  break;
                }
              }
              var displayVal;
              if (typeCode === 3) {
                var t = String(rawVal).trim().toLowerCase();
                displayVal = (t === "false" || t === "0" || t === "no" || t === "off" || t === "") ? "No" : "Yes";
              } else {
                displayVal = String(rawVal).trim();
                if (!displayVal) continue;
              }
              userFieldRows.push({ label: String(defLabel), value: displayVal });
            }
            // Second: render remaining values without definitions
            for (var vi2 = 0; vi2 < cfValues.length; vi2++) {
              var item = cfValues[vi2];
              var fid = item.id ?? item.ID ?? item.fieldId ?? item.FieldId;
              if (fid == null || seen[String(fid)]) continue;
              var lbl = item.label ?? item.Label ?? item.title ?? item.Title ?? ("Field " + fid);
              var val = item.fieldValue ?? item.FieldValue ?? item.value ?? item.Value ?? "";
              val = String(val).trim();
              if (!val) continue;
              userFieldRows.push({ label: String(lbl), value: val });
            }
            renderUserFields(userFieldRows);
          }
        } catch(e) { /* user fields non-critical */ }
      } catch(err) {
        showError(err.message || "Failed to load project");
        return;
      }

      try {
        var histResp = await fetch("/api/v2/projects/" + projectId + "/history?startIndex=0&count=50", { credentials: "same-origin" });
        if (!histResp.ok) throw new Error("HTTP " + histResp.status);
        var histRaw = await histResp.json();
        var events = histRaw.data || histRaw.rows || histRaw || [];
        renderEvents(events);
      } catch(e) {
        document.getElementById("project-events").innerHTML = '<li class="project-empty">Failed to load events</li>';
      }
    })();

    // --- Add Note editor ---
    document.getElementById("phtml-add-note-btn").addEventListener("click", function() {
      var wrap = document.getElementById("phtml-note-editor-wrap");
      var isOpen = wrap.classList.contains("active");

    document.getElementById("phtml-note-cancel").addEventListener("click", function() {

      document.getElementById("phtml-note-editor").innerHTML = "";
      var bdbtn = document.querySelector(".phtml-note-actions .note-backdate-btn");

    // Format button handler — passes data-val for formatBlock commands
    document.querySelectorAll(".phtml-note-format-btn").forEach(function(btn) {
      btn.addEventListener("click", function(e) {
        // Skip overflow/highlight/emoji/link/color/img-upload buttons — handled separately
        if (btn.classList.contains("note-format-overflow-btn") ||
            btn.classList.contains("note-format-hilite-btn") ||
            btn.classList.contains("note-format-emoji-btn") ||
            btn.classList.contains("note-format-link-btn") ||
            btn.classList.contains("note-format-color-btn") ||
            btn.classList.contains("note-format-img-upload-btn")) return;
        var cmd = btn.getAttribute("data-cmd");
        if (!cmd) return;
        e.preventDefault();
        var editor = document.getElementById("phtml-note-editor");
        if (editor) editor.focus();
        var val = btn.getAttribute("data-val") || null;
        if (cmd === "hiliteColor" || cmd === "backColor") {
          document.execCommand("hiliteColor", false, "#c8e6c9");
        } else {
          document.execCommand(cmd, false, val);
        }
      });
    });

    // Overflow menu (··· button)
    (function() {
      var overflowBtn = document.querySelector(".phtml-note-format-toolbar .note-format-overflow-btn");
      var toolbar = overflowBtn && overflowBtn.closest(".phtml-note-format-toolbar");
      if (!overflowBtn || !toolbar) return;
      var dd = null;
      function closeOverflow() {
        if (!dd) return;
        dd.classList.remove("open");
        var anchor = toolbar.querySelector(".note-format-overflow-btn");
        dd.querySelectorAll("[data-overflow]").forEach(function(el) { toolbar.insertBefore(el, anchor); });
      }
      overflowBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        if (dd && dd.classList.contains("open")) { closeOverflow(); return; }
        if (!dd) {
          dd = document.createElement("div");
          dd.className = "note-format-overflow-dropdown";
        }
        dd.innerHTML = "";
        toolbar.querySelectorAll("[data-overflow]").forEach(function(el) { dd.appendChild(el); });
        document.body.appendChild(dd);
        dd.classList.add("open");
        var rect = overflowBtn.getBoundingClientRect();
        dd.style.position = "fixed";
        dd.style.top = (rect.bottom + 4) + "px";
        dd.style.right = (window.innerWidth - rect.right) + "px";
        dd.style.left = "auto";
        dd.onclick = function() { setTimeout(closeOverflow, 50); };
      });
      document.addEventListener("click", function(e) {
        if (!e.target.closest(".note-format-overflow-btn") && !e.target.closest(".note-format-overflow-dropdown")) closeOverflow();
      });
    })();

    // Highlight color picker
    (function() {
      var btn = document.querySelector(".phtml-note-format-toolbar .note-format-hilite-btn");
      if (!btn) return;
      var colors = [
        { name: "Green", css: "rgba(200,230,201,0.45)" },
        { name: "Yellow", css: "rgba(255,249,196,0.55)" },
        { name: "Blue", css: "rgba(187,222,251,0.45)" },
        { name: "Pink", css: "rgba(248,187,208,0.40)" },
        { name: "Orange", css: "rgba(255,224,178,0.50)" },
        { name: "Purple", css: "rgba(206,147,216,0.35)" }
      ];
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        var existing = document.querySelector(".phtml-hilite-dropdown");
        if (existing) { existing.remove(); return; }
        var dd = document.createElement("div");
        dd.className = "phtml-hilite-dropdown note-format-overflow-dropdown";
        colors.forEach(function(c) {
          var swatch = document.createElement("button");
          swatch.type = "button";
          swatch.className = "note-format-overflow-dropdown note-format-btn";
          swatch.style.cssText = "width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:" + c.css + ";display:inline-flex;align-items:center;justify-content:center;padding:0;";
          swatch.title = c.name;
          swatch.addEventListener("click", function(ev) {
            ev.stopPropagation();
            dd.remove();
            var editor = document.getElementById("phtml-note-editor");
            if (editor) { editor.focus(); document.execCommand("hiliteColor", false, c.css); }
          });
          dd.appendChild(swatch);
        });
        document.body.appendChild(dd);
        var rect = btn.getBoundingClientRect();
        dd.style.position = "fixed";
        dd.style.top = (rect.bottom + 4) + "px";
        dd.style.left = rect.left + "px";
        dd.style.right = "auto";
        dd.style.display = "flex";
        dd.style.zIndex = "99999";
        setTimeout(function() {
          document.addEventListener("click", function handler() { dd.remove(); document.removeEventListener("click", handler); }, { once: true });
        }, 0);
      });
    })();

    // Text color picker
    (function() {
      var btn = document.querySelector(".phtml-note-format-toolbar .note-format-color-btn");
      if (!btn) return;
      var colors = [
        { name: "Default", css: "" },
        { name: "Red", css: "#ef5350" },
        { name: "Orange", css: "#ff9800" },
        { name: "Green", css: "#66bb6a" },
        { name: "Blue", css: "#42a5f5" },
        { name: "Purple", css: "#ab47bc" },
        { name: "Gray", css: "#9e9e9e" }
      ];
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        var existing = document.querySelector(".phtml-color-dropdown");
        if (existing) { existing.remove(); return; }
        var dd = document.createElement("div");
        dd.className = "phtml-color-dropdown note-format-overflow-dropdown";
        colors.forEach(function(c) {
          var swatch = document.createElement("button");
          swatch.type = "button";
          swatch.className = "note-format-overflow-dropdown note-format-btn";
          swatch.style.cssText = "width:28px;height:28px;border-radius:50%;border:2px solid " + (c.css || "var(--border)") + ";cursor:pointer;background:" + (c.css || "var(--text)") + ";display:inline-flex;align-items:center;justify-content:center;padding:0;";
          swatch.title = c.name;
          swatch.addEventListener("click", function(ev) {
            ev.stopPropagation();
            dd.remove();
            var editor = document.getElementById("phtml-note-editor");
            if (editor) { editor.focus(); document.execCommand("foreColor", false, c.css || "#e0e0e0"); }
          });
          dd.appendChild(swatch);
        });
        document.body.appendChild(dd);
        var rect = btn.getBoundingClientRect();
        dd.style.position = "fixed";
        dd.style.top = (rect.bottom + 4) + "px";
        dd.style.left = rect.left + "px";
        dd.style.right = "auto";
        dd.style.display = "flex";
        dd.style.zIndex = "99999";
        setTimeout(function() {
          document.addEventListener("click", function handler() { dd.remove(); document.removeEventListener("click", handler); }, { once: true });
        }, 0);
      });
    })();

    // Emoji picker
    (function() {
      var btn = document.querySelector(".phtml-note-format-toolbar .note-format-emoji-btn");
      if (!btn) return;
      var emojis = ["😀","😂","😍","🤔","👍","👎","❤️","🔥","✅","⭐","📌","📝","🎯","💬","📎","🔗","📊","🗓️","✨","🙏"];
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        var existing = document.querySelector(".phtml-emoji-dropdown");
        if (existing) { existing.remove(); return; }
        var dd = document.createElement("div");
        dd.className = "phtml-emoji-dropdown note-format-overflow-dropdown";
        dd.style.cssText = "display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;min-width:180px;";
        emojis.forEach(function(em) {
          var item = document.createElement("button");
          item.type = "button";
          item.textContent = em;
          item.style.cssText = "background:none;border:none;font-size:1.2rem;padding:4px 6px;cursor:pointer;border-radius:4px;";
          item.addEventListener("click", function(ev) {
            ev.stopPropagation();
            dd.remove();
            var editor = document.getElementById("phtml-note-editor");
            if (editor) { editor.focus(); document.execCommand("insertText", false, em); }
          });
          dd.appendChild(item);
        });
        document.body.appendChild(dd);
        var rect = btn.getBoundingClientRect();
        dd.style.position = "fixed";
        dd.style.top = (rect.bottom + 4) + "px";
        dd.style.left = rect.left + "px";
        dd.style.right = "auto";
        dd.style.zIndex = "99999";
        setTimeout(function() {
          document.addEventListener("click", function handler() { dd.remove(); document.removeEventListener("click", handler); }, { once: true });
        }, 0);
      });
    })();

    // Link insertion
    (function() {
      var btn = document.querySelector(".phtml-note-format-toolbar .note-format-link-btn");
      if (!btn) return;
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        var url = prompt("Enter URL:");
        if (url) {
          var editor = document.getElementById("phtml-note-editor");
          if (editor) { editor.focus(); document.execCommand("createLink", false, url); }
        }
      });
    })();

    // Image upload
    (function() {
      var btn = document.querySelector(".phtml-note-format-toolbar .note-format-img-upload-btn");
      if (!btn) return;
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        var input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.addEventListener("change", function() {
          var file = input.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function(ev) {
            var editor = document.getElementById("phtml-note-editor");
            if (editor) {
              editor.focus();
              document.execCommand("insertHTML", false, '<img src="' + ev.target.result + '" style="max-width:200px;max-height:150px;border-radius:4px;" />');
            }
          };
          reader.readAsDataURL(file);
        });
        input.click();
      });
    })();

    // Wire @-mention autocomplete
    setupMentionAutocomplete(
      document.getElementById("phtml-note-editor"),
      document.getElementById("phtml-mention-dropdown")
    );

    // Backdate picker
    document.addEventListener("click", function(e) {
      var btn = e.target.closest(".note-backdate-btn");
      if (!btn) return;
      e.stopPropagation();
      e.preventDefault();
      var temp = document.createElement("input");
      temp.type = "date";
      if (btn.dataset.backdateValue) temp.value = btn.dataset.backdateValue;
      var r = btn.getBoundingClientRect();
      temp.style.cssText = "position:fixed;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px;opacity:0;z-index:99999;pointer-events:auto;";
      document.body.appendChild(temp);
      var cleanup = function() { if (temp.parentNode) temp.remove(); };
      var openPicker = function() {
        try { if (temp.showPicker) { temp.showPicker(); return; } } catch(_) {}
        temp.click();
      };
      requestAnimationFrame(function() { openPicker(); setTimeout(openPicker, 50); });
      temp.addEventListener("change", function() {
        btn.dataset.backdateValue = temp.value || "";
        var label = btn.parentElement ? btn.parentElement.querySelector(".backdate-display") : null;
        if (label) {
          if (temp.value) {
            var parts = temp.value.split("-");
            label.textContent = parts[1] + "/" + parts[2] + "/" + parts[0];
            label.classList.remove("hidden");
          } else {
            label.textContent = "";
            label.classList.add("hidden");
          }
        }
        cleanup();
      });
      setTimeout(cleanup, 15000);
    });

    document.getElementById("phtml-note-submit").addEventListener("click", async function() {
      var ed = document.getElementById("phtml-note-editor");
      var content = (ed.innerHTML || "").trim();
      if (!content || /^(<br\s*\/?>|\s*|<div>\s*<br\s*\/?>\s*<\/div>)$/i.test(content)) {
        showToast("Please write a note first.", true);
        return;
      }
      // Add note-inline-img class to images so they get lightbox in preview modals
      content = content.replace(/<img(?![^>]*class="note-inline-img")([^>]*)>/gi, '<img class="note-inline-img" $1>');
      var submitBtn = document.getElementById("phtml-note-submit");
      submitBtn.disabled = true;
      try {
        var notifyUserList = extractMentions(ed).map(String);
        var bdbtn = document.querySelector(".phtml-note-actions .note-backdate-btn");
        var backdateVal = bdbtn ? bdbtn.dataset.backdateValue || "" : "";
        var createdIso = "";
        if (backdateVal) {
          var parts = backdateVal.split("-");
          createdIso = new Date(backdateVal + "T12:00:00").toISOString();
        }
        var body = { content: content, categoryId: "10" };
        if (notifyUserList.length) body.notifyUserList = notifyUserList;
        if (createdIso) body.created = createdIso;
        var resp = await fetch("/api/v2/projects/" + projectId + "/history", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(body)
        });
        if (!resp.ok) {
          var errBody;
          try { errBody = await resp.json(); } catch(e) { errBody = {}; }
          throw new Error(errBody.error || "HTTP " + resp.status);
        }
        ed.innerHTML = "";
        document.getElementById("phtml-note-editor-wrap").classList.remove("active");
        if (bdbtn) delete bdbtn.dataset.backdateValue;
        var bddisplay = document.querySelector(".phtml-note-actions .backdate-display");
        if (bddisplay) { bddisplay.textContent = ""; bddisplay.classList.add("hidden"); }
        showToast("Note added");

        var histResp = await fetch("/api/v2/projects/" + projectId + "/history?startIndex=0&count=50", { credentials: "same-origin" });
        if (histResp.ok) {
          var histRaw = await histResp.json();
          var events = histRaw.data || histRaw.rows || histRaw || [];
          renderEvents(events);
        }
      } catch(err) {
        showToast("Failed to add note: " + (err.message || err), true);
      } finally {
        submitBtn.disabled = false;
      }
    });
  })();

  // Delegated handler for email expand/collapse buttons
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.event-email-expand-btn');
    if (!btn) return;
    var targetId = btn.getAttribute('data-target');
    var full = document.getElementById(targetId);
    if (!full) return;
    var isHidden = full.style.display === 'none';
    full.style.display = isHidden ? 'block' : 'none';
    btn.textContent = isHidden ? 'Collapse' : 'Show full email';
  });
  </script>
</body>
</html>
