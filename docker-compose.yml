services:
  dashboard:
    container_name: sietch-crm
    build: .
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8766/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - .env
    environment:
      PORT: "8766"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DB_HOST: db
      DB_PORT: "5432"
      # DOCS_INTERNAL_URL is intentionally omitted here; set it in .env.
      # When the Document Server is on a separate droplet, set it to the public
      # URL (same as DOCS_PUBLIC_URL). When co-located in Docker, set the
      # container hostname/port (e.g., https://onlyoffice-docserver:443).
      CONTAINER_NAME: "sietch-crm"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dashboard-data:/app/data
      - dashboard-uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      # Backup destination. The history-attachments bundle alone is ~29GB
      # per run, which does not fit on the 77GB root volume (26GB free) —
      # a full disk takes the whole app down. The 100GB attached volume is
      # mounted here and BACKUP_DIR points at it (see .env).
      - /mnt/sietch_backup:/backup
    # The dashboard container runs as uid/gid 10001 (appuser), but the mounted
    # /var/run/docker.sock is srw-rw---- root:docker -- so without this
    # supplementary group the non-root runtime user gets "permission denied
    # while trying to connect to the docker API" and the admin Infrastructure
    # tab reports the socket as unavailable. DOCKER_GID is the host's docker
    # group gid (987 on the production droplet); override it if a host differs.
    group_add:
      - "${DOCKER_GID:-987}"
    ports:
      # Loopback only: the host nginx terminates TLS and proxies in. Binding
      # 0.0.0.0 would expose the dashboard over plain HTTP, bypassing the
      # certificate (and COOKIE_SECURE=true would then refuse the session).
      - "127.0.0.1:8766:8766"
    networks:
      - sietch-internal

  db:
    image: docker.io/library/postgres:16-alpine
    container_name: sietch-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sietch-internal

  docserver:
    image: docker.io/onlyoffice/documentserver:latest
    container_name: onlyoffice-docserver
    restart: unless-stopped
    environment:
      - JWT_SECRET=${DOCS_JWT_SECRET:-change_me_in_production}
      - REDIS_SERVER_HOST=redis
      - REDIS_SERVER_PORT=6379
    depends_on:
      - redis
    volumes:
      - docserver-data:/var/www/onlyoffice/Data
      - docserver-logs:/var/log/onlyoffice
    ports:
      # The Document Server's internal nginx listens on :80 only (there is no
      # :443 listener), so map 80 — not 443 — to the host. nginx on the host
      # terminates TLS for docs.<domain> and proxies plain HTTP to here.
      # Loopback only, for the same reason as the dashboard above.
      - "127.0.0.1:8080:80"
    networks:
      - sietch-internal

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: sietch-redis
    restart: unless-stopped
    networks:
      - sietch-internal

volumes:
  dashboard-data:
  dashboard-uploads:
  db-data:
  docserver-data:
  docserver-logs:

networks:
  sietch-internal:
    driver: bridge
