name: Smoke Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python:
    name: Python unit tests
    runs-on: ubuntu-latest

    # `import server` eagerly opens the psycopg2 pool, so tests that import
    # it (infrastructure) need a real database. Presence/automation/
    # timesheet/telegram suites run against mocked layers and don't.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sietch_crm
          POSTGRES_USER: sietch
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: sietch_crm
      DB_USER: sietch
      DB_PASSWORD: ci_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run event_bus tests
        run: python3 tests/test_event_bus.py -v

      - name: Run backup tests
        run: python3 tests/test_backup.py -v

      - name: Run import conflict regression tests
        run: python3 tests/test_import_conflict.py -v

      - name: Run onlyoffice import tests
        run: python3 tests/test_onlyoffice_import.py

      - name: Run presence store tests
        run: python3 tests/test_presence_store.py

      - name: Run automation engine tests
        run: python3 tests/test_automation_engine.py

      - name: Run timesheet overdue checker tests
        run: python3 tests/test_timesheet_overdue_checker.py

      - name: Run telegram bot tests
        run: python3 tests/test_telegram_bot.py

      - name: Run admin gating tests
        run: python3 tests/test_admin_gating.py

      - name: Run mail template auth tests
        run: python3 tests/test_mail_template_auth.py

      - name: Run attachment mirror + bookmark title tests
        run: python3 tests/test_attachment_mirror_and_bookmark_titles.py

      - name: Run scanner toggle + project_number tests
        run: python3 tests/test_scanner_toggle_gating.py

      - name: Run contact sync + mail attachment OnlyOffice-first tests
        run: python3 tests/test_contact_and_mail_attach_fixes.py

      - name: Run sync pull-deals field + email body backfill tests
        run: python3 tests/test_sync_pull_deals_fields.py

      - name: Run branding header tests
        run: python3 tests/test_branding_header.py

      - name: Run infrastructure tests
        run: python3 tests/test_infrastructure.py

      - name: Run customize tests
        run: python3 tests/test_customize.py

      - name: Run reports tests
        run: python3 tests/test_reports.py

      - name: Run search modal tests
        run: python3 tests/test_search_modal.py

      - name: Run mail link history tests
        run: python3 tests/test_mail_link_history.py -v

      - name: Run note attachment scoping tests
        run: python3 tests/test_note_attachment_scoping.py -v

      - name: Run mail polling tests
        run: python3 tests/test_mail_polling.py -v

      - name: Run mail behavior gating tests
        run: python3 tests/test_mail_behaviors.py -v

      - name: Run mail drafts endpoint tests
        run: python3 tests/test_mail_drafts_endpoint.py -v

      - name: Run note normalize tests
        run: python3 tests/test_note_normalize.py -v

      - name: Run history replies batch tests
        run: python3 tests/test_history_replies_batch.py -v

      - name: Run reply deleted-parent tests
        run: python3 tests/test_history_reply_deleted_parent.py -v

      - name: Run documents batch download tests
        run: python3 tests/test_documents_batch_download.py -v

      - name: Run stage+due correction dry-run tests
        run: python3 tests/test_sync_correction_dryrun.py -v

      - name: Run timestamp UTC tests
        run: python3 tests/test_timestamp_utc.py -v

      - name: Run note type filter tests
        run: node --test tests/test_note_type_filter.mjs

      - name: Run create-project unwrap tests
        run: node --test tests/test_create_opp_unwrap.mjs

      - name: Run Graph OAuth status tests
        run: python3 tests/test_graph_oauth_status.py -v

      - name: Run mail snippet tests
        run: node --test tests/test_mail_snippet.mjs

      - name: Run Graph truthfulness tests
        run: python3 tests/test_graph_truthfulness.py -v

      - name: Run linked email attachment tests
        run: python3 tests/test_linked_email_attachments.py -v

      - name: Run mail forward quote tests
        run: node --test tests/test_mail_forward_quote.mjs

      - name: Run presence custom status tests
        run: node --test tests/test_presence_custom_status.mjs

      - name: Run responsible-keep tests
        run: node --test tests/test_responsible_keep.mjs

      - name: Run project partial-update tests
        run: python3 tests/test_project_update_partial.py -v

      - name: Run notification snippet tests
        run: python3 tests/test_notification_snippet.py -v

      - name: Run supplemental sync tests
        run: python3 tests/test_sync_supplemental.py -v

      - name: Run users tests
        run: python3 tests/test_users.py

  node:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run pure-helper tests
        run: node --test tests/test_*.mjs

  syntax:
    name: Server syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check server.py
        run: |
          python -m py_compile server.py
          python -m py_compile event_bus.py
          python -m py_compile backup_service.py
          python -m py_compile oauth_providers.py
          python -m py_compile smtp_client.py
          python -m py_compile telegram_bot.py
          python -m py_compile automation_engine.py
          python -m py_compile infra_log.py
          python -m py_compile presence_store.py
          python -m py_compile timesheet_overdue_checker.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check app.js
        run: node --check public/app.js