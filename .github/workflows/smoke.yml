name: Smoke Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python:
    name: Python unit tests
    runs-on: ubuntu-latest

    # `import server` eagerly opens the psycopg2 pool, so tests that import
    # it (infrastructure) need a real database. Presence/automation/
    # timesheet/telegram suites run against mocked layers and don't.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sietch_crm
          POSTGRES_USER: sietch
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: sietch_crm
      DB_USER: sietch
      DB_PASSWORD: ci_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run event_bus tests
        run: python3 tests/test_event_bus.py -v

      - name: Run backup tests
        run: python3 tests/test_backup.py -v

      - name: Run import conflict regression tests
        run: python3 tests/test_import_conflict.py -v

      - name: Run onlyoffice import tests
        run: python3 tests/test_onlyoffice_import.py

      - name: Run presence store tests
        run: python3 tests/test_presence_store.py

      - name: Run automation engine tests
        run: python3 tests/test_automation_engine.py

      - name: Run timesheet overdue checker tests
        run: python3 tests/test_timesheet_overdue_checker.py

      - name: Run telegram bot tests
        run: python3 tests/test_telegram_bot.py

      - name: Run admin gating tests
        run: python3 tests/test_admin_gating.py

      - name: Run mail template auth tests
        run: python3 tests/test_mail_template_auth.py

      - name: Run attachment mirror + bookmark title tests
        run: python3 tests/test_attachment_mirror_and_bookmark_titles.py

      - name: Run scanner toggle + project_number tests
        run: python3 tests/test_scanner_toggle_gating.py

      - name: Run contact sync + mail attachment OnlyOffice-first tests
        run: python3 tests/test_contact_and_mail_attach_fixes.py

      - name: Run infrastructure tests
        run: python3 tests/test_infrastructure.py

      - name: Run customize tests
        run: python3 tests/test_customize.py

      - name: Run reports tests
        run: python3 tests/test_reports.py

      - name: Run search modal tests
        run: python3 tests/test_search_modal.py

      - name: Run users tests
        run: python3 tests/test_users.py

  node:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run pure-helper tests
        run: node --test tests/test_pure_helpers.mjs

  syntax:
    name: Server syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check server.py
        run: |
          python -m py_compile server.py
          python -m py_compile event_bus.py
          python -m py_compile backup_service.py
          python -m py_compile oauth_providers.py
          python -m py_compile smtp_client.py
          python -m py_compile telegram_bot.py
          python -m py_compile automation_engine.py
          python -m py_compile infra_log.py
          python -m py_compile presence_store.py
          python -m py_compile timesheet_overdue_checker.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check app.js
        run: node --check public/app.js